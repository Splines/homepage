name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Cancel superseded runs of the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint --config ./.config/eslint.mjs --max-warnings 0 .

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby # version is read from .ruby-version
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0 # increment to re-download cached gems

      - name: Run RSpec
        run: bundle exec rspec
