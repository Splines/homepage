# see also https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
name: Deploy Jekyll to Cloudflare Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy in a single job: a separate deploy job costs a second runner
  # start-up plus an artifact upload/download of the whole site (~15-20s).
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0 # increment to re-download cached gems

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Calls Wrangler directly instead of cloudflare/wrangler-action: the action
      # first probes for a local install with `npx --no-install` (which takes ~5s
      # to fail), then installs Wrangler and checks its version again (~12s total).
      # https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy ./_site --project-name=splines
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
