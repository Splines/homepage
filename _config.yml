title: Splines
author: Splines
description: >-
  Programming, music, physics, math... A little blog to document some learnings and ideas.

baseurl: "" # the subpath of your site, e.g. /blog
url: https://splines.me

collections:
  pages:
    output: true
    permalink: /:path/
  # Blog posts live in `_blog/<year>/<slug>/` and bundle their assets with them.
  # See also _plugins/blog_bundles.rb.
  blog:
    output: true
    permalink: /blog/:path/
  # Store products live in `_store/<slug>/` and bundle their assets with them.
  # See also _plugins/store_bundles.rb.
  store:
    output: true
    permalink: /store/:path/

# Forces the Dodo Payments checkout into a given mode ("test" or "live"), overriding the
# default (`jekyll serve` -> test, production build -> live). Use it to rehearse the live
# checkout locally; the store page shows a warning banner while it is active.
#
# ⚠️ Comment this out again when you are done — otherwise `bin/dev` keeps taking REAL
# payments, and test cards will be declined. Requires a restart of `bin/dev` to apply.
# dodo_force_mode: live

feed:
  excerpt_only: true
  disable_in_development: true
  collections:
    blog:
      path: /feed.xml
    # jekyll-feed always emits a `posts` feed
    # it is empty now, so we "hide" it at a side path here
    posts:
      path: /feed/posts.xml

# No theme: https://stackoverflow.com/a/57424621/

plugins:
  - jekyll/vite
  - jekyll-feed

exclude:
  - bin/
  - config/
  - tmp/
  - assets/vite/ # Vite source dir; the compiled bundle is emitted to /vite
  - _blog/**/*.ts # post-scoped Vite sources, bundled by Vite (see SPECS.md)
  - _blog/**/*.py # post-scoped scripts, e.g. to render a preview image
  - _blog/**/*.pyc # Python bytecode cache of those scripts
  - vite.config.mts
  - Rakefile
  - spec/
  - package.json
  - package-lock.json
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .venv/ # Python env for post scripts; its lib64 -> lib symlink confuses the file watcher
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# https://minimalbb.github.io/cheat%20sheet/kramdown-markdown-guide-with-jekyll
kramdown:
  syntax_highlighter: nil

# Site-wide KaTeX macros, see _plugins/katex.rb. A page only gets those it uses, and
# can add its own under `katex: macros:` in its front matter.
katex:
  macros:
    # In an aligned environment: an arrow below the "=" of the rows around it, with an
    # explanation next to it. Use \\ for line breaks, the arrow grows along. The arrow
    # is drawn by CSS (_sass/_explain.scss), which _layouts/page.html links if used.
    \explain: '\mathrel{\hphantom{=}}\textcolor{88593a}{\htmlClass{explain}{\vphantom{\Big|}\small\begin{gathered}#1\end{gathered}}}'
