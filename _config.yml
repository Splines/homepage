title: Splines
author: Splines
description: >-
  Programming, music, physics, math... A little blog to document some learnings and ideas.

baseurl: "" # the subpath of your site, e.g. /blog
url: https://splines.me

collections:
  pages:
    output: true
    permalink: /:path/
  # Blog posts live in `_blog/<year>/<slug>/` and bundle their assets with them.
  # See also _plugins/blog_bundles.rb.
  blog:
    output: true
    permalink: /blog/:path/
  # Store products live in `_store/<slug>/` and bundle their assets with them.
  # See also _plugins/store_bundles.rb.
  store:
    output: true
    permalink: /store/:path/

# Forces the Dodo Payments checkout into a given mode ("test" or "live"), overriding the
# default (`jekyll serve` -> test, production build -> live). Use it to rehearse the live
# checkout locally; the store page shows a warning banner while it is active.
#
# ⚠️ Comment this out again when you are done — otherwise `bin/dev` keeps taking REAL
# payments, and test cards will be declined. Requires a restart of `bin/dev` to apply.
# dodo_force_mode: live

# The store is finished but not open for business yet: Dodo Payments still has to
# verify the account, so a checkout would fail. While this is `false`, the product
# pages stay reachable under their URLs (Dodo needs to review them), but the store is
# not advertised: no tile on the home page, no "Buy" button, and search engines are
# asked to stay away (see robots.txt). Flip it to `true` to open the store.
store_open: false

feed:
  excerpt_only: true
  disable_in_development: true
  collections:
    blog:
      path: /feed.xml
    # jekyll-feed always emits a `posts` feed
    # it is empty now, so we "hide" it at a side path here
    posts:
      path: /feed/posts.xml

# No theme: https://stackoverflow.com/a/57424621/

plugins:
  - jekyll/vite
  - jekyll-feed

exclude:
  - bin/
  - config/
  - tmp/
  - assets/vite/ # Vite source dir; the compiled bundle is emitted to /vite
  - vite.config.mts
  - Rakefile
  - package.json
  - package-lock.json
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# https://minimalbb.github.io/cheat%20sheet/kramdown-markdown-guide-with-jekyll
kramdown:
  syntax_highlighter: nil
